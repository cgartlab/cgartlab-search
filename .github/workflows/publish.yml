name: Publish to skill registries

# 手动重发入口：把默认分支当前 SKILL.md 的版本重新发布到 ClawHub / SkillHub。
#
# 正式发布由 release.yml 在打 tag 时自动完成 —— 不需要本 workflow 参与。
# 这里只用于三种情况：补发失败的发布、修好 token 后重试、用 dry_run=true
# 验证 token 与打包流程。
#
# 注意：registry 通常拒绝重复的版本号，重发前先确认目标版本没有发布成功过。
#
# 发布逻辑在 .github/actions/publish，内联在本仓库，不依赖外部 reusable
# workflow（public 仓库调用 private 仓库的 reusable workflow 会直接被拒）。

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate and package only - do not publish"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Publish to ClawHub / SkillHub
        uses: ./.github/actions/publish
        with:
          slug: cgartlab-search
          display-name: "CGArtLab Search"
          dry-run: ${{ inputs.dry_run }}
          clawhub-token: ${{ secrets.CLAWHUB_TOKEN }}
          skillhub-api-key: ${{ secrets.SKILLHUB_API_KEY }}
