name: CI

# 轻量门禁：脚本语法、JSON 合法、frontmatter 版本存在、密钥不入库
# 触发收窄到 main：功能分支改动由 PR（base=main）承载校验，避免中间 push 重复烧额度。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: 语法与密钥门禁
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 与本地完全同一套门禁（scripts/gate.sh）：脚本语法 / JSON 合法 /
      # SKILL.md metadata.version / 密钥不入库。单一事实源，避免 CI 与本地漂移。
      - name: 门禁（scripts/gate.sh）
        run: bash scripts/gate.sh