name: CI

# 轻量门禁：脚本语法、JSON 合法、frontmatter 版本存在、密钥不入库
# 触发收窄到 main：功能分支改动由 PR（base=main）承载校验，避免中间 push 重复烧额度。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: 语法与密钥门禁
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 脚本语法（mjs + sh）
        run: |
          node --check scripts/search.mjs
          bash -n scripts/search.sh

      - name: JSON 合法（evals 与密钥模板）
        run: |
          python3 -m json.tool evals/evals.json > /dev/null
          python3 -m json.tool secrets.example.json > /dev/null

      - name: SKILL.md 必须声明 metadata.version
        run: |
          python3 - <<'PYEOF'
          import re, sys
          t = open('SKILL.md', encoding='utf-8').read()
          m = re.search(r'^metadata:\s*$\n\s+version:\s*"(\d+\.\d+\.\d+)"', t, re.M)
          if not m:
              sys.exit('SKILL.md frontmatter 缺少 metadata.version')
          print('metadata.version =', m.group(1))
          PYEOF

      - name: 密钥不入库
        run: |
          if git ls-files --error-unmatch secrets.json 2>/dev/null; then
            echo "::error::secrets.json 被 git 跟踪了"; exit 1
          fi
          python3 - <<'PYEOF'
          import json, sys
          d = json.load(open('secrets.example.json', encoding='utf-8'))
          filled = [k for k, v in d.items() if v]
          if filled:
              sys.exit('secrets.example.json 存在非空值: ' + ', '.join(filled))
          print('secrets.example.json 全为空值，OK')
          PYEOF